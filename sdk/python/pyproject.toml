[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llamarun"
version = "1.1.0"
description = "Python SDK for writing LlamaRun plugins"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
authors = [{ name = "Krish Baidya" }]

[tool.setuptools]
packages = ["llamarun"]
py-modules = ["plugin_host"]

[tool.setuptools.package-data]
llamarun = ["py.typed"]
